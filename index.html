<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Framer Motion UI — Animated Patterns Demo</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/framer-motion@11/dist/framer-motion.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #080b16; color: #e2e8f0; font-family: 'Inter', system-ui, -apple-system, sans-serif; overflow-x: hidden; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #0f1420; }
  ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const { motion, AnimatePresence, useInView, useScroll, useTransform, useMotionValue, useSpring, useReducedMotion, animate, stagger } = window.Motion;
const { useState, useEffect, useRef } = React;

// ── Scroll Reveal Component ──
function Reveal({ children, className = "", delay = 0 }) {
  const ref = useRef(null);
  const isInView = useInView(ref, { once: true, margin: "-80px" });
  return React.createElement(motion.div, {
    ref,
    initial: { opacity: 0, y: 40 },
    animate: isInView ? { opacity: 1, y: 0 } : {},
    transition: { duration: 0.6, delay, ease: [0.22, 1, 0.36, 1] },
    className
  }, children);
}

// ── Parallax Section ──
function ParallaxSection({ children, className = "" }) {
  const ref = useRef(null);
  const { scrollYProgress } = useScroll({ target: ref, offset: ["start end", "end start"] });
  const y = useTransform(scrollYProgress, [0, 1], ["12%", "-12%"]);
  return React.createElement(motion.div, { ref, style: { y }, className }, children);
}

// ── Stagger List ──
function StaggerList({ items }) {
  const container = { hidden: { opacity: 0 }, show: { opacity: 1, transition: { staggerChildren: 0.1, delayChildren: 0.2 } } };
  const item = { hidden: { opacity: 0, x: -20 }, show: { opacity: 1, x: 0, transition: { duration: 0.4, ease: "easeOut" } } };
  const ref = useRef(null);
  const isInView = useInView(ref, { once: true, margin: "-60px" });

  return React.createElement(motion.ul, {
    ref, variants: container, initial: "hidden", animate: isInView ? "show" : "hidden",
    className: "space-y-3 list-none"
  }, items.map((text, i) =>
    React.createElement(motion.li, { key: i, variants: item, className: "flex items-center gap-3" },
      React.createElement("span", { className: "w-2 h-2 bg-blue-400 rounded-full flex-shrink-0" }),
      React.createElement("span", { className: "text-gray-300" }, text)
    )
  ));
}

// ── Animated Counter ──
function AnimatedCounter({ to, label, duration = 2 }) {
  const ref = useRef(null);
  const isInView = useInView(ref, { once: true });
  const count = useMotionValue(0);
  const rounded = useTransform(count, v => Math.round(v));
  useEffect(() => { if (isInView) { const c = animate(count, to, { duration, ease: "easeOut" }); return c.stop; } }, [isInView]);
  return React.createElement("div", { ref, className: "text-center" },
    React.createElement("div", { className: "text-4xl font-extrabold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent" },
      React.createElement(motion.span, null, rounded), "+"),
    React.createElement("div", { className: "text-gray-500 text-sm mt-1" }, label)
  );
}

// ── Fluid Card ──
function FluidCard({ icon, title, desc }) {
  return React.createElement(motion.div, {
    whileHover: { scale: 1.02, y: -4 },
    whileTap: { scale: 0.98 },
    transition: { type: "spring", stiffness: 300, damping: 20 },
    className: "bg-[#0f1420] border border-[#1a2040] rounded-2xl p-6 cursor-pointer hover:border-blue-500/30 transition-colors"
  },
    React.createElement("div", { className: "text-3xl mb-3" }, icon),
    React.createElement("h3", { className: "text-lg font-bold mb-2" }, title),
    React.createElement("p", { className: "text-gray-400 text-sm leading-relaxed" }, desc)
  );
}

// ── Main App ──
function App() {
  const prefersReduced = useReducedMotion();

  const cards = [
    { icon: "🎯", title: "Entrance Animations", desc: "Staggered reveals that guide attention and create hierarchy on page load." },
    { icon: "📜", title: "Scroll Triggers", desc: "Elements animate into view as the user scrolls, creating a narrative flow." },
    { icon: "🖱️", title: "Interactive Gestures", desc: "Hover, tap, and drag interactions with spring physics for tactile feedback." },
    { icon: "🔄", title: "Page Transitions", desc: "Seamless mount/unmount animations with AnimatePresence for routing." },
    { icon: "📊", title: "Number Counters", desc: "Animated statistics that count up when scrolled into view." },
    { icon: "🎨", title: "Layout Animations", desc: "Automatic reflow animations when elements are added, removed, or reordered." },
    { icon: "🏔️", title: "Parallax Effects", desc: "Depth-based scroll animations that create immersion." },
    { icon: "♿", title: "Accessible", desc: "Built-in useReducedMotion() support for users with motion sensitivity." },
  ];

  const features = [
    "GPU-accelerated: only transform + opacity animated",
    "Spring physics for natural-feeling interactions",
    "Stagger orchestration for list reveals",
    "AnimatePresence for mount/unmount transitions",
    "Scroll-linked animations with useScroll/useTransform",
    "Layout animations for automatic reflow",
    "Gesture system: hover, tap, pan, drag",
    "Zero-config exit animations",
  ];

  return React.createElement("div", { className: "min-h-screen" },

    // ── HERO ──
    React.createElement(motion.section, {
      initial: prefersReduced ? {} : { opacity: 0 },
      animate: { opacity: 1 },
      transition: { duration: 0.8 },
      className: "min-h-screen flex items-center justify-center relative overflow-hidden px-6"
    },
      React.createElement("div", { className: "absolute inset-0 bg-gradient-to-b from-blue-500/5 to-purple-500/5" }),
      React.createElement("div", { className: "text-center relative z-10 max-w-3xl" },
        React.createElement(motion.h1, {
          initial: prefersReduced ? {} : { opacity: 0, y: 30 },
          animate: { opacity: 1, y: 0 },
          transition: { duration: 0.7, delay: 0.2, ease: [0.22, 1, 0.36, 1] },
          className: "text-5xl md:text-7xl font-extrabold tracking-tight leading-tight"
        },
          "Motion that ", React.createElement("span", { className: "bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400 bg-clip-text text-transparent" }, "means"), " something"
        ),
        React.createElement(motion.p, {
          initial: prefersReduced ? {} : { opacity: 0, y: 20 },
          animate: { opacity: 1, y: 0 },
          transition: { duration: 0.5, delay: 0.4 },
          className: "text-xl text-gray-400 mt-6 leading-relaxed"
        }, "Production-grade Framer Motion patterns for React. Purposeful animation that guides, communicates, and delights — without the jank."),
        React.createElement(motion.div, {
          initial: prefersReduced ? {} : { opacity: 0, y: 20 },
          animate: { opacity: 1, y: 0 },
          transition: { duration: 0.5, delay: 0.6 },
          className: "flex gap-4 mt-10 justify-center flex-wrap"
        },
          React.createElement(motion.a, {
            href: "https://github.com/AtlasNexusOps/framer-motion-ui",
            target: "_blank",
            whileHover: { scale: 1.05 },
            whileTap: { scale: 0.97 },
            className: "px-8 py-3.5 bg-blue-600 hover:bg-blue-500 rounded-xl font-semibold transition-colors no-underline text-white inline-block"
          }, "GitHub"),
          React.createElement(motion.a, {
            href: "#patterns",
            whileHover: { scale: 1.05 },
            whileTap: { scale: 0.97 },
            className: "px-8 py-3.5 border border-gray-600 hover:border-gray-400 rounded-xl font-semibold transition-colors no-underline text-white inline-block"
          }, "View Patterns ↓")
        )
      )
    ),

    // ── COUNTERS ──
    React.createElement("section", { className: "py-24 px-6" },
      React.createElement("div", { className: "max-w-4xl mx-auto" },
        React.createElement(Reveal, null,
          React.createElement("h2", { className: "text-3xl font-bold text-center mb-16" },
            "Proven ", React.createElement("span", { className: "text-blue-400" }, "Performance"))
        ),
        React.createElement("div", { className: "grid grid-cols-2 md:grid-cols-4 gap-8" },
          React.createElement(Reveal, { delay: 0 }, React.createElement(AnimatedCounter, { to: 60, label: "FPS Guaranteed" })),
          React.createElement(Reveal, { delay: 0.1 }, React.createElement(AnimatedCounter, { to: 0, label: "Layout Reflows" })),
          React.createElement(Reveal, { delay: 0.2 }, React.createElement(AnimatedCounter, { to: 11, label: "Animation Patterns" })),
          React.createElement(Reveal, { delay: 0.3 }, React.createElement(AnimatedCounter, { to: 100, label: "GPU Accelerated" }))
        )
      )
    ),

    // ── PATTERNS CARDS ──
    React.createElement("section", { id: "patterns", className: "py-24 px-6 bg-[#060912]" },
      React.createElement("div", { className: "max-w-6xl mx-auto" },
        React.createElement(Reveal, null,
          React.createElement("h2", { className: "text-3xl font-bold text-center mb-4" }, "Animation Patterns"),
          React.createElement("p", { className: "text-gray-400 text-center mb-16 max-w-xl mx-auto" }, "Ready-to-use components for every motion need. Hover the cards.")
        ),
        React.createElement("div", { className: "grid md:grid-cols-2 lg:grid-cols-4 gap-5" },
          cards.map((card, i) =>
            React.createElement(Reveal, { key: i, delay: i * 0.05 },
              React.createElement(FluidCard, { icon: card.icon, title: card.title, desc: card.desc })
            )
          )
        )
      )
    ),

    // ── STAGGER LIST ──
    React.createElement("section", { className: "py-24 px-6" },
      React.createElement("div", { className: "max-w-4xl mx-auto" },
        React.createElement(Reveal, null,
          React.createElement("h2", { className: "text-3xl font-bold text-center mb-16" },
            "Delivery ", React.createElement("span", { className: "text-purple-400" }, "Checklist"))
        ),
        React.createElement(StaggerList, { items: features })
      )
    ),

    // ── PARALLAX CTA ──
    React.createElement("section", { className: "py-32 px-6 relative overflow-hidden" },
      React.createElement("div", { className: "absolute inset-0 bg-gradient-to-r from-blue-600/10 to-purple-600/10" }),
      React.createElement(ParallaxSection, { className: "max-w-3xl mx-auto text-center relative z-10" },
        React.createElement("h2", { className: "text-4xl font-extrabold mb-6" }, "Ready to add life to your UI?"),
        React.createElement("p", { className: "text-xl text-gray-400 mb-10" }, "Clone the repo, read the skill, ship better animations today."),
        React.createElement(motion.a, {
          href: "https://github.com/AtlasNexusOps/framer-motion-ui",
          target: "_blank",
          whileHover: { scale: 1.05 },
          whileTap: { scale: 0.97 },
          className: "px-10 py-4 bg-gradient-to-r from-blue-600 to-purple-600 rounded-xl font-bold text-lg hover:from-blue-500 hover:to-purple-500 transition-all no-underline text-white inline-block shadow-lg shadow-purple-500/20"
        }, "Get Started →")
      )
    ),

    // ── FOOTER ──
    React.createElement("footer", { className: "py-12 text-center text-gray-600 text-sm border-t border-[#1a2040]" },
      "Framer Motion UI · Built by ", React.createElement("a", { href: "https://github.com/AtlasNexusOps", className: "text-blue-400 hover:underline" }, "Atlas Nexus"), " · Powered by Framer Motion"
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
